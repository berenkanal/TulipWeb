<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senin İçin 🌷</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: linear-gradient(135deg, #fff0f5, #fce1ed, #fff7fa);
    font-family: Georgia, serif;
}

.scene {
    position: relative;
    width: 300px;
    height: 390px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.flower {
    position: relative;
    width: 120px;
    height: 300px;
    transform-origin: bottom center;
    animation: sway 4s ease-in-out infinite;
}

.stem {
    position: absolute;
    width: 8px;
    height: 190px;
    background: linear-gradient(to right, #39864b, #8acb83);
    border-radius: 10px;
    left: 56px;
    top: 105px;
}

.leaf {
    position: absolute;
    width: 55px;
    height: 25px;
    background: linear-gradient(45deg, #36854a, #8bcf83);
    border-radius: 100% 0 100% 0;
    top: 210px;
}

.leaf.left {
    left: 8px;
    transform: rotate(15deg);
}

.leaf.right {
    right: 0;
    top: 245px;
    transform: rotate(165deg);
}

.bloom {
    position: absolute;
    top: 30px;
    left: 10px;
    width: 100px;
    height: 115px;
    transform-origin: bottom center;
}

.petal {
    position: absolute;
    bottom: 0;
    width: 38px;
    height: 90px;
    background: linear-gradient(135deg, #ffb5d0, #e84c91);
    border-radius: 60% 60% 35% 35%;
    transform-origin: bottom center;
    opacity: 0;
    animation: openPetal 2s ease-out forwards;
}

.petal:nth-child(1) {
    left: 31px;
    animation-delay: .2s;
}

.petal:nth-child(2) {
    left: 5px;
    transform: rotate(-35deg) scale(.8);
    animation-delay: .8s;
}

.petal:nth-child(3) {
    right: 5px;
    transform: rotate(35deg) scale(.8);
    animation-delay: 1.2s;
}

.petal:nth-child(4) {
    left: 31px;
    background: linear-gradient(135deg, #ffd1e1, #f27bab);
    animation-delay: 1.5s;
}

.sparkle {
    position: absolute;
    color: #e6a6c4;
    font-size: 22px;
    animation: sparkle 2s infinite alternate;
}

.s1 { top: 55px; left: 30px; }
.s2 { top: 120px; right: 20px; animation-delay: .7s; }
.s3 { top: 220px; left: 15px; animation-delay: 1s; }
.s4 { top: 30px; right: 35px; animation-delay: .4s; }

.message {
    margin-top: -5px;
    color: #b64f7c;
    font-size: 25px;
    text-align: center;
    opacity: 0;
    animation: appear 2s ease forwards;
    animation-delay: 3s;
}

@keyframes openPetal {
    from { opacity: 0; transform: rotate(0deg) scale(.1); }
    to { opacity: 1; transform: rotate(0deg) scale(1); }
}

@keyframes sway {
    0%, 100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
}

@keyframes sparkle {
    from { opacity: .2; transform: scale(.7) rotate(0deg); }
    to { opacity: 1; transform: scale(1.3) rotate(30deg); }
}

@keyframes appear {
    to { opacity: 1; }
}
</style>
</head>

<body>
<div class="scene">
    <span class="sparkle s1">✧</span>
    <span class="sparkle s2">✦</span>
    <span class="sparkle s3">✧</span>
    <span class="sparkle s4">✦</span>

    <div class="flower">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="bloom">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
        </div>
    </div>
</div>

<div class="message">
    Senin için açtı bu çiçek 🌷
</div>
</body>
</html>
